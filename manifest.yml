# Registered Forge application. Deployment and real Jira validation are tracked separately.
modules:
  jira:issuePanel:
    - key: handoff-lens-panel
      resource: main
      title: Handoff Lens
      icon: resource:main;icon.svg
resources:
  - key: main
    path: forge-build
permissions:
  scopes:
    - read:jira-work
app:
  id: ari:cloud:ecosystem::app/99a47bb9-5664-46a4-a6fa-2cf004d3fbc7
  runtime:
    name: nodejs24.x
