<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Handoff Lens — local Forge build</title>
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="./index.html">Handoff<span>Lens</span></a>
    <label><span data-i18n="lang">Language</span><select id="language"><option value="en">English</option><option value="zh-Hant">繁體中文</option><option value="ja">日本語</option></select></label>
  </header>
  <main>
    <section class="intro"><p class="eyebrow" data-i18n="eyebrow"></p><h1 data-i18n="title"></h1><p class="lede" data-i18n="intro"></p></section>
    <p id="mode" class="mode"></p><p class="limits" data-i18n="limits"></p>
    <section class="workspace" aria-label="Handoff workspace">
      <form id="scope-form" class="controls">
        <label class="field"><span data-i18n="keys"></span><textarea id="issue-keys" rows="3" maxlength="200" spellcheck="false" aria-describedby="keys-hint"></textarea></label>
        <p id="keys-hint" class="hint" data-i18n="keysHint"></p>
        <label id="scenario-field" class="field"><span data-i18n="scenario"></span><select id="scenario"><option value="baseline" data-i18n="baseline"></option><option value="drift" data-i18n="drift"></option><option value="permission" data-i18n="permission"></option></select></label>
        <button id="check" class="primary" type="submit" data-i18n="check"></button>
        <div class="reference"><label class="field"><span data-i18n="import"></span><input id="reference-file" type="file" accept=".json,application/json"></label><button id="use-scope" type="button" data-i18n="loaded"></button><p class="hint" data-i18n="loadedHint"></p></div>
        <div class="actions"><button id="download" type="button" disabled data-i18n="export"></button><button id="clear" type="button" data-i18n="clear"></button></div>
      </form>
      <section class="results" aria-label="Signal results"><p id="status" role="status" aria-live="polite"></p><div id="report-meta"></div><div id="results"></div></section>
    </section>
    <aside class="notes"><p data-i18n="rules"></p><p data-i18n="caution"></p><p data-i18n="permissionCaution"></p><p data-i18n="noPersistence"></p></aside>
    <footer><a href="./help.html" data-i18n="help"></a><span>LOCAL BUILD / NOT DEPLOYED</span><a href="./THIRD_PARTY_NOTICES.txt">Third-party notices</a></footer>
  </main>
</body>
</html>
